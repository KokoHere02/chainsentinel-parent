spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chainsentinel?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: your_mysql_username
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

chainsentinel:
  debug:
    rule-test-match-enabled: true
  security:
    crypto:
      key-base64: YOUR_BASE64_KEY
  scanner:
    enabled: true
    chain: ETH
    network: sepolia
    rpc-url: https://your-eth-rpc-endpoint
    window-size: 2
    confirm-required: 12
    initial-start-block: 0
    rpc-retry-max: 3
    rpc-retry-backoff-ms: 300
    full-eth-scan: false
  alert:
    enabled: true
    webhook-url: http://localhost:8080/api/alerts/handler
    retry-max: 5
    batch-size: 100
    dispatch-interval-ms: 10000
  price:
    tick:
      enabled: true
      queue-capacity: 20000
      batch-size: 200
      flush-interval-ms: 1000
    tick-retention:
      enabled: true
      retention-days: 30
      cleanup-interval-ms: 86400000
    tick-backfill:
      # Run once per day (default 03:00 Asia/Shanghai)
      daily-cron: 0 0 3 * * *
      # Default lookback window in days
      retention-days: 30
      # OKX candle bar value
      bar: 1m
      # Page size per round
      page-limit: 300
      # Max rounds per run
      max-rounds: 1000
      # Sleep between rounds in milliseconds
      sleep-ms: 50
    ws:
      okx:
        guard:
          # Drop quote if jump exceeds ratio inside short window
          max-jump-ratio: 0.2
          # Short window in ms for jump detection
          short-window-ms: 2000

logging:
  level:
    com.chainsentinel: INFO