spring:
  application:
    name: chainsentinel
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]"

chainsentinel:
  debug:
    rule-test-match-enabled: false
  auth:
    jwt-secret: ${CHAINSENTINEL_AUTH_JWT_SECRET:change-me-in-production}
    access-token-ttl-seconds: ${CHAINSENTINEL_AUTH_ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${CHAINSENTINEL_AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
    login-fail-max-attempts: ${CHAINSENTINEL_AUTH_LOGIN_FAIL_MAX_ATTEMPTS:5}
    login-fail-window-seconds: ${CHAINSENTINEL_AUTH_LOGIN_FAIL_WINDOW_SECONDS:300}
    login-lock-seconds: ${CHAINSENTINEL_AUTH_LOGIN_LOCK_SECONDS:600}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}

