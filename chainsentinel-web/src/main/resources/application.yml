spring:
  application:
    name: chainsentinel
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]"

chainsentinel:
  debug:
    rule-test-match-enabled: false
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}

