version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: chainsentinel-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chainsentinel
      TZ: UTC
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: chainsentinel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  mysql_data:

