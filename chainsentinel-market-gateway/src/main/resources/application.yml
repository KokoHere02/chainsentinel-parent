server:
  port: ${SERVER_PORT:18080}

chainsentinel:
  market-gateway:
    security:
      internal-token:
        enabled: ${MARKET_GATEWAY_INTERNAL_TOKEN_ENABLED:false}
        header-name: ${MARKET_GATEWAY_INTERNAL_TOKEN_HEADER:X-Internal-Token}
        token: ${MARKET_GATEWAY_INTERNAL_TOKEN:}
    noop-provider:
      enabled: ${MARKET_GATEWAY_NOOP_PROVIDER_ENABLED:true}
  price:
    market-data:
      gateway:
        enabled: false
